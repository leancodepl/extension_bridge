name: extension_bridge_example
description: Demonstrates and integration tests the extension_bridge plugin.
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  extension_bridge:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  leancode_lint: ^27.0.0

flutter:
  uses-material-design: true
  # The sources shown by the "Full source" buttons of the demo.
  assets:
    - lib/main.dart
    - lib/demo/art.dart
    - ios/Shared/Demo.swift
    - ios/Shared/Intents.swift
    - ios/Shared/OrderAttributes.swift
    - ios/Widgets/CounterWidget.swift
    - ios/Widgets/ArtWidget.swift
    - ios/Widgets/ChartWidget.swift
    - ios/Widgets/OrderLiveActivity.swift
    - ios/Widgets/Controls.swift
    - ios/Share/ShareViewController.swift
    - ios/Runner/AppIntents.swift
    - ios/Runner/DemoFeatures.swift
